<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C62828"/>
      <stop offset="45%" style="stop-color:#A81F1F"/>
      <stop offset="100%" style="stop-color:#8B1717"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F9A825"/>
      <stop offset="55%" style="stop-color:#FBC02D"/>
      <stop offset="100%" style="stop-color:#D98E1A"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8D6E63"/>
      <stop offset="100%" style="stop-color:#6D4C41"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A237E"/>
      <stop offset="100%" style="stop-color:#283593"/>
    </linearGradient>
    <radialGradient id="innerShine" cx="35%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.10"/>
      <stop offset="60%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="blur"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ===================== PRIMARY VARIANT: CIRCULAR EMBLEM ===================== -->
  <g id="logo-primary" transform="translate(0,0)" filter="url(#softShadow)">
    <circle cx="500" cy="460" r="380" fill="url(#sealGrad)"/>
    <circle cx="500" cy="460" r="380" fill="url(#innerShine)"/>
    <circle cx="500" cy="460" r="358" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" opacity="0.9"/>
    <circle cx="500" cy="460" r="340" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.22"/>

    <!-- Gold corner accents -->
    <g opacity="0.75">
      <path d="M260 220 L278 220 L278 238" stroke="url(#goldGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M740 220 L722 220 L722 238" stroke="url(#goldGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M260 700 L278 700 L278 682" stroke="url(#goldGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M740 700 L722 700 L722 682" stroke="url(#goldGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <!-- KANJI 理 - Pure Vector Path Version (White on Seal) -->
    <g id="kanji-vector-white" transform="translate(500,440)">
      <!-- LEFT RADICAL: 王 (King/Jewel) -->
      <!-- Top horizontal (王) -->
      <path d="M -152 -128
               Q -156 -134 -148 -140
               L -88 -148
               Q -80 -150 -72 -144
               Q -68 -138 -74 -132
               L -134 -124
               Q -146 -122 -152 -128 Z"
            fill="#FFFFFF" stroke-linejoin="round"/>
      <!-- Middle horizontal (王) -->
      <path d="M -140 -38
               Q -146 -44 -138 -50
               L -92 -56
               Q -82 -58 -76 -50
               Q -72 -44 -78 -38
               L -124 -30
               Q -136 -28 -140 -38 Z"
            fill="#FFFFFF" stroke-linejoin="round"/>
      <!-- Bottom horizontal (王) - longer -->
      <path d="M -40 86
               Q -28 92 -18 86
               L 30 78
               Q 40 76 46 70
               Q 42 62 30 60
               L -30 68
               Q -40 70 -40 86 Z"
            fill="#FFFFFF" stroke-linejoin="round"/>
      <!-- Vertical (王) - connects horizontals -->
      <path d="M -110 -140
               L -106 -144
               Q -100 -148 -94 -144
               L -90 -140
               L -98 -52
               Q -100 -44 -96 -36
               L -92 -28
               L -88 62
               Q -86 70 -90 76
               Q -96 80 -102 76
               Q -106 70 -104 62
               L -108 -32
               Q -110 -40 -108 -48
               L -112 -132
               Q -114 -138 -110 -140 Z"
            fill="#FFFFFF" stroke-linejoin="round"/>

      <!-- RIGHT PART: 里 (Village / Ri) -->
      <!-- 田 (Rice paddy) - top enclosure -->
      <!-- Top bar of 田 -->
      <path d="M 10 -168
               Q 4 -174 10 -180
               L 128 -168
               Q 136 -166 140 -158
               Q 138 -150 130 -148
               L 28 -158
               Q 16 -160 10 -168 Z"
            fill="#FFFFFF" stroke-linejoin="round"/>
      <!-- Left side of 田 -->
      <path d="M 10 -176
               L 4 -180
               Q -2 -184 -6 -178
               L -8 -170
               L -4 -48
               Q -2 -40 -6 -32
               L -10 -24
               Q -14 -18 -8 -14
               Q -2 -12 2 -18
               L 6 -26
               L 10 -168
               Q 10 -174 10 -176 Z"
            fill="#FFFFFF" stroke-linejoin="round"/>
      <!-- Right side of 田 -->
      <path d="M 134 -166
               L 140 -170
               Q 146 -174 148 -166
               L 150 -158
               L 146 -30
               Q 144 -22 148 -14
               L 152 -6
               Q 156 0 150 4
               Q 144 6 140 0
               L 136 -8
               L 132 -158
               Q 132 -164 134 -166 Z"
            fill="#FFFFFF" stroke-linejoin="round"/>
      <!-- Bottom bar of 田 (also top of middle divider area) -->
      <path d="M -4 -30
               Q -10 -36 -4 -42
               L 140 -28
               Q 148 -26 150 -18
               Q 148 -10 140 -8
               L 12 -20
               Q 0 -22 -4 -30 Z"
            fill="#FFFFFF" stroke-linejoin="round"/>
      <!-- Horizontal divider inside 田 -->
      <path d="M -2 -100
               Q -8 -106 -2 -112
               L 144 -98
               Q 152 -96 152 -88
               Q 150 -80 142 -78
               L 4 -90
               Q -4 -92 -2 -100 Z"
            fill="#FFFFFF" stroke-linejoin="round"/>
      <!-- Vertical divider inside 田 -->
      <path d="M 66 -170
               L 60 -174
               Q 54 -178 52 -170
               L 50 -162
               L 56 -88
               Q 58 -80 54 -72
               L 50 -64
               Q 46 -58 52 -54
               Q 58 -52 62 -58
               L 66 -66
               L 70 -162
               Q 72 -170 66 -170 Z"
            fill="#FFFFFF" stroke-linejoin="round"/>

      <!-- Middle horizontal below 田 -->
      <path d="M 28 68
               Q 22 74 30 80
               L 160 62
               Q 170 60 176 52
               Q 172 44 162 42
               L 48 58
               Q 36 60 28 68 Z"
            fill="#FFFFFF" stroke-linejoin="round"/>

      <!-- Bottom long horizontal (里 base) with upward curve on left -->
      <path d="M 20 206
               Q 8 216 4 228
               Q 0 240 12 246
               Q 24 248 32 240
               L 46 222
               L 180 206
               Q 194 204 206 210
               Q 210 218 204 224
               Q 194 228 182 226
               L 50 242
               Q 38 244 28 236
               Q 24 228 28 220
               L 40 206
               Q 32 204 20 206 Z"
            fill="#FFFFFF" stroke-linejoin="round"/>

      <!-- Central vertical spine of 里 (connects 田 bottom through middle to base) -->
      <path d="M 66 -34
               L 60 -38
               Q 54 -42 52 -34
               L 50 -26
               L 58 50
               Q 60 58 56 66
               L 52 74
               Q 48 80 54 84
               Q 60 86 64 80
               L 68 72
               L 74 204
               Q 76 212 72 218
               Q 66 222 60 218
               Q 56 212 58 204
               L 62 72
               Q 64 64 62 56
               L 66 -34 Z"
            fill="#FFFFFF" stroke-linejoin="round"/>
    </g>

    <!-- Gold decorative dots at cardinal points -->
    <g fill="url(#goldGrad)" opacity="0.9">
      <circle cx="500" cy="108" r="6"/>
      <circle cx="500" cy="812" r="6"/>
      <circle cx="128" cy="460" r="6"/>
      <circle cx="872" cy="460" r="6"/>
    </g>
  </g>

  <!-- ===================== WORDMARK: EL DOJO ===================== -->
  <g id="wordmark-primary" transform="translate(500,880)">
    <rect x="-188" y="-28" width="376" height="56" rx="28"
          fill="#FFFFFF" stroke="url(#woodGrad)" stroke-width="2"/>
    <g font-family="'Montserrat','Inter','Segoe UI',Arial,sans-serif" text-anchor="middle" dominant-baseline="central">
      <text x="-92" y="1" font-size="26" font-weight="800" letter-spacing="5.5" fill="url(#indigoGrad)">EL</text>
      <circle cx="0" cy="0" r="5" fill="url(#goldGrad)"/>
      <text x="100" y="1" font-size="26" font-weight="800" letter-spacing="5.5" fill="url(#indigoGrad)">DOJO</text>
    </g>
  </g>

  <!-- ===================== MARK-ONLY (Icon Size) ===================== -->
  <g id="logo-mark-only" opacity="0" transform="translate(-8000,-8000)">
    <circle cx="500" cy="500" r="450" fill="url(#sealGrad)"/>
    <circle cx="500" cy="500" r="450" fill="url(#innerShine)"/>
    <circle cx="500" cy="500" r="428" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.9"/>
    <g id="kanji-mark-only" transform="translate(500,500) scale(1.18)">
      <use href="#kanji-vector-white"/>
    </g>
  </g>

  <!-- ===================== HORIZONTAL LOCKUP ===================== -->
  <g id="logo-horizontal-lockup" opacity="0" transform="translate(-8000,-8000)">
    <g transform="translate(160,500) scale(0.72)">
      <circle cx="0" cy="0" r="380" fill="url(#sealGrad)"/>
      <circle cx="0" cy="0" r="358" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" opacity="0.9"/>
    </g>
    <g font-family="'Montserrat','Inter',sans-serif" fill="url(#indigoGrad)">
      <text x="560" y="440" font-size="88" font-weight="800" letter-spacing="3">EL DOJO</text>
      <text x="560" y="530" font-size="22" font-weight="500" letter-spacing="4" fill="#8D6E63">PRINCIPIO · CAMINO · DISCIPLINA</text>
    </g>
  </g>

  <!-- ===================== MONOCHROME / REVERSED Variants ===================== -->
  <g id="logo-monochrome-black" opacity="0" transform="translate(-8000,-8000)">
    <circle cx="500" cy="460" r="380" fill="#1A1A1A"/>
    <circle cx="500" cy="460" r="340" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
    <g transform="translate(500,440)">
      <use href="#kanji-vector-white"/>
    </g>
  </g>

  <g id="logo-outline-only" opacity="0" transform="translate(-8000,-8000)">
    <circle cx="500" cy="460" r="380" fill="none" stroke="#C62828" stroke-width="4"/>
    <g transform="translate(500,440)" fill="none" stroke="#C62828" stroke-width="2">
      <use href="#kanji-vector-white"/>
    </g>
  </g>
</svg>
