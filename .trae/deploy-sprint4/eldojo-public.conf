# ============================================================
# ElDojo — SITIO PÚBLICO (Público Auth Flow) + www redirect
#   server_name: eldojo.tech  www.eldojo.tech
#   root:        /eldojo/eldojo-front/dist       (intacto legado)
# GENERADO Sprint 4 deploy — NO EDITAR A MANO
# ============================================================

# ------ HTTP -> HTTPS 301 (todos los nombres) ------
server {
    listen 80;
    server_name eldojo.tech www.eldojo.tech;

    return 301 https://$host$request_uri;
}

# ------ www.eldojo.tech → eldojo.tech (HTTPS, evita dup content) ------
server {
    listen 443 ssl;
    http2 on;
    server_name www.eldojo.tech;

    # SSL: inicialmente comentado, certbot --nginx inyecta paths correctos:
    # ssl_certificate     /etc/letsencrypt/live/eldojo.tech/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/eldojo.tech/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://eldojo.tech$request_uri;
}

# ============================================================
#  eldojo.tech  PRINCIPAL PÚBLICO  (catch-all auth / landing)
# ============================================================
server {
    listen 443 ssl http2;
    server_name eldojo.tech;

    # SSL: inyectado por certbot --expand
    # ssl_certificate     /etc/letsencrypt/live/eldojo.tech/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/eldojo.tech/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /eldojo/eldojo-front/dist;
    index index.html;

    # -------- Backend API (SIN CACHE + ANTI-502 en deploy) --------
    location /api/ {
        proxy_connect_timeout 20s;
        proxy_send_timeout    75s;
        proxy_read_timeout    75s;
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 12s;
        proxy_buffering on;
        proxy_request_buffering on;

        proxy_pass         http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        # Cross-subdomain cookie JWT — IMPORTANTE: 3 portals comparten sesión
        proxy_cookie_domain eldojo.tech .eldojo.tech;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0, private" always;
        add_header Pragma        "no-cache" always;
        proxy_no_cache     1;
        proxy_cache_bypass 1;
    }

    # -------- Docs / Swagger / openapi.json --------
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_connect_timeout 20s;
        proxy_send_timeout    75s;
        proxy_read_timeout    75s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 12s;
        proxy_buffering on;

        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store, no-cache, max-age=0, private" always;
        proxy_no_cache     1;
        proxy_cache_bypass 1;
    }

    # -------- Uploads --------
    location /uploads/ {
        proxy_connect_timeout 20s;
        proxy_send_timeout    75s;
        proxy_read_timeout    75s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 12s;
        proxy_buffering on;

        proxy_pass         http://127.0.0.1:5001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        add_header Cache-Control "private, max-age=300, must-revalidate" always;
    }

    # -------- [R1] NUNCA cachear HTML --------
    location ~* \.(?:html|htm)$ {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0, private" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "Thu, 01 Jan 1970 00:00:00 GMT" always;
        add_header Surrogate-Control "no-store" always;
        etag off;
        if_modified_since off;
    }

    # -------- [R2] /_expo/ bundles (hash in name, INMUTABLES) --------
    location /_expo/ {
        try_files $uri =404;
        access_log off;
        expires    1y;
        add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable" always;
    }

    # -------- [R3] /assets/ 30 días --------
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires    30d;
        add_header Cache-Control "public, max-age=2592000, s-maxage=2592000" always;
    }

    # -------- [R4] JS/CSS/fonts/images fuera de carpetas --------
    location ~* \.(?:js|mjs|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|ico|webp|avif|map)$ {
        try_files $uri =404;
        access_log off;
        expires    1y;
        add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable" always;
    }

    # -------- [R5] SPA fallback catch-all (PUBLIC auth flow) --------
    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0, private" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "Thu, 01 Jan 1970 00:00:00 GMT" always;
        add_header Surrogate-Control "no-store" always;
        etag off;
        if_modified_since off;
    }
}
