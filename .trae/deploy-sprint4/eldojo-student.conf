# ============================================================
# ElDojo — STUDENT portal
#   server_name: mi.eldojo.tech
#   root:        /eldojo/eldojo-front/dist-student   (build EXPO_PUBLIC_APP_MODE=student)
#   Cross-gate:  JS bundle kickea gym admins (StatusView + signOut) — AppNavigator.tsx
# GENERADO Sprint 4 deploy — NO EDITAR A MANO
# ============================================================

# ------ HTTP -> HTTPS 301 ------
server {
    listen 80;
    server_name mi.eldojo.tech;

    return 301 https://$host$request_uri;
}

# ============================================================
#  mi.eldojo.tech  PRINCIPAL STUDENT FLOW
# ============================================================
server {
    listen 443 ssl http2;
    server_name mi.eldojo.tech;

    # SSL: inyectado por certbot --expand
    # ssl_certificate     /etc/letsencrypt/live/eldojo.tech/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/eldojo.tech/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /eldojo/eldojo-front/dist-student;
    index index.html;

    # -------- Backend API --------
    location /api/ {
        proxy_connect_timeout 20s;
        proxy_send_timeout    75s;
        proxy_read_timeout    75s;
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 12s;
        proxy_buffering on;
        proxy_request_buffering on;

        proxy_pass         http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        proxy_cookie_domain eldojo.tech .eldojo.tech;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0, private" always;
        add_header Pragma        "no-cache" always;
        proxy_no_cache     1;
        proxy_cache_bypass 1;
    }

    # -------- Docs/Swagger (lo mantenemos por si alguien cae aqui) --------
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_connect_timeout 20s;
        proxy_send_timeout    75s;
        proxy_read_timeout    75s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 12s;
        proxy_buffering on;

        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store, no-cache, max-age=0, private" always;
        proxy_no_cache     1;
        proxy_cache_bypass 1;
    }

    # -------- Uploads --------
    location /uploads/ {
        proxy_connect_timeout 20s;
        proxy_send_timeout    75s;
        proxy_read_timeout    75s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 12s;
        proxy_buffering on;

        proxy_pass         http://127.0.0.1:5001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        add_header Cache-Control "private, max-age=300, must-revalidate" always;
    }

    # -------- [R1] No cachear HTML --------
    location ~* \.(?:html|htm)$ {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0, private" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "Thu, 01 Jan 1970 00:00:00 GMT" always;
        add_header Surrogate-Control "no-store" always;
        etag off;
        if_modified_since off;
    }

    # -------- [R2] /_expo/ inmutables --------
    location /_expo/ {
        try_files $uri =404;
        access_log off;
        expires    1y;
        add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable" always;
    }

    # -------- [R3] /assets/ --------
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires    30d;
        add_header Cache-Control "public, max-age=2592000, s-maxage=2592000" always;
    }

    # -------- [R4] JS/CSS/images/fonts --------
    location ~* \.(?:js|mjs|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|ico|webp|avif|map)$ {
        try_files $uri =404;
        access_log off;
        expires    1y;
        add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable" always;
    }

    # -------- [R5] SPA fallback — Student Flow (activar?token=, perfil, seguridad, asistencia) --------
    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0, private" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "Thu, 01 Jan 1970 00:00:00 GMT" always;
        add_header Surrogate-Control "no-store" always;
        etag off;
        if_modified_since off;
    }
}
